name: Build & Release APK

# Runs every time AI Studio (or you) pushes to main.
# Also runnable manually from the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# Needed so the workflow is allowed to create a Release.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Keystore for Signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding repository secret KEYSTORE_BASE64 to my-upload-key.jks..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          else
            echo "No custom keystore secret provided; generating build signing keystore..."
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=ClassRoll, OU=App, O=AIStudio, L=City, S=State, C=US"
          fi

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if ./gradlew --version >/dev/null 2>&1; then
            echo "Building with Gradle Wrapper..."
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            echo "Building with Gradle CLI..."
            gradle assembleRelease --stacktrace --no-daemon
          fi

      - name: Locate & Prepare Release APK
        id: prepare_apk
        run: |
          mkdir -p release_out
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No release APK found in app/build/outputs/apk/release!"
            exit 1
          fi
          echo "Found release APK: $APK_FILE"
          FINAL_APK="release_out/ClassRoll-build-${{ github.run_number }}.apk"
          cp "$APK_FILE" "$FINAL_APK"
          echo "apk_path=$FINAL_APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassRoll-APK
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 30

      - name: Set Release Tag
        id: vars
        run: echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "ClassRoll – build ${{ github.run_number }}"
          make_latest: true
          files: ${{ steps.prepare_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
