name: Build & Release APK

# Runs every time AI Studio (or you) pushes to main.
# Also runnable manually from the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# Needed so the workflow is allowed to create a Release.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a637b3a4e1706d3132e0bf49ab4633632\n8933902d0775e460b80f4e5a0e283a7d11413d29\nd56f51508286000c7c158107f7948d14e5628597\n60100772780c44369179421288e0c07a1469782f\nf39934297f000e3a3273702c23410b63b156901d\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c05772d9a158b1713028d7845763a725\n8e5425713d0c1de0b40e3262f741544aa8495a1a" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "33b622f7cb01413d70a3e6f6a0f45a7424f70401" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo -e "60100772780c44369179421288e0c07a1469782f" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          echo -e "854734e56d36da5c68057d13e77d9a0b0825305f" > "$ANDROID_HOME/licenses/google-gdk-license"
          echo -e "e96678292d8ac641b2d23e3ea62341f012b70f00" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Keystore for Signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding repository secret KEYSTORE_BASE64 to my-upload-key.jks..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          elif [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore.base64 to debug.keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "No custom keystore secret or debug.keystore.base64 provided; generating build signing keystore..."
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=ClassRoll, OU=App, O=AIStudio, L=City, S=State, C=US"
          fi

      - name: Setup Google Services Configuration
        run: |
          mkdir -p app/src/main app/src/release app/src/Release
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Restoring google-services.json from repository secret GOOGLE_SERVICES_JSON..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          fi
          if [ ! -s "app/google-services.json" ]; then
            echo "Creating google-services.json configuration..."
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "657750499614",
    "project_id": "gen-lang-client-0269184419",
    "storage_bucket": "gen-lang-client-0269184419.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:657750499614:android:867b393c7714dd5f1d690f",
        "android_client_info": {
          "package_name": "com.aistudio.classroll.jkmxlp"
        }
      },
      "oauth_client": [
        {
          "client_id": "657750499614-11qkk1egv33laah5eq40rlatjio3b538.apps.googleusercontent.com",
          "client_type": 1,
          "android_info": {
            "package_name": "com.aistudio.classroll.jkmxlp",
            "certificate_hash": "55a7157d505e08cbc325ea816ce7cf4ec278801d"
          }
        },
        {
          "client_id": "657750499614-goc2ljrqu9bt97gtt5do2brrttp9n6gj.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyAR8ntGRu1L0HCc_ufey50p5vdWZIE_SkY"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "657750499614-goc2ljrqu9bt97gtt5do2brrttp9n6gj.apps.googleusercontent.com",
              "client_type": 3
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi
          cp -f app/google-services.json app/src/google-services.json
          cp -f app/google-services.json app/src/main/google-services.json
          cp -f app/google-services.json app/src/release/google-services.json
          cp -f app/google-services.json app/src/Release/google-services.json



      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Locate & Prepare Release APK
        id: prepare_apk
        run: |
          mkdir -p release_out
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No release APK found in app/build/outputs/apk/release!"
            exit 1
          fi
          echo "Found release APK: $APK_FILE"
          FINAL_APK="release_out/ClassRoll-build-${{ github.run_number }}.apk"
          cp "$APK_FILE" "$FINAL_APK"
          echo "apk_path=$FINAL_APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassRoll-APK
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 30

      - name: Set Release Tag
        id: vars
        run: echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "ClassRoll – build ${{ github.run_number }}"
          make_latest: true
          files: ${{ steps.prepare_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
